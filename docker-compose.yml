version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - TZ=Asia/Kolkata
      # Secrets come from the gitignored root .env — never inline them here.
      - GEMINI_KEY=${GEMINI_KEY}
      # The tutor's RAG node calls FastAPI. `localhost` inside this container
      # is the container itself, so it must be addressed on the host gateway.
      - FASTAPI_URL=http://host.docker.internal:8000
      # Must match backend/.env ADMIN_SECRET or /api/rag/retrieve returns 401.
      - ADMIN_SECRET=${ADMIN_SECRET}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_VARIABLES_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always

volumes:
  n8n_data:
